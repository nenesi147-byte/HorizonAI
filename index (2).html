<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizon AI</title>
<style>
:root{--glass:rgba(255,255,255,.1);--line:rgba(255,255,255,.14);--text:#f1eeff;--dim:#b9b2e0;--accent:#8b5cf6}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(55% 45% at 50% 40%,#6d28d9 0%,transparent 70%),radial-gradient(40% 40% at 90% 95%,#86198f 0%,transparent 70%),linear-gradient(#10051f,#1e0b3f 60%,#2a0f4f) fixed}
button,textarea,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid #c4b5fd;outline-offset:2px}
.hidden{display:none!important}
.app{display:grid;grid-template-columns:230px 1fr 250px;gap:16px;height:100dvh;padding:16px}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.3);border-radius:22px;backdrop-filter:blur(32px) saturate(190%);-webkit-backdrop-filter:blur(32px) saturate(190%);box-shadow:0 10px 40px rgba(25,5,60,.55),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.08)}
.side,.spaces{padding:18px 14px;display:flex;flex-direction:column;gap:6px;align-self:start;max-height:100%}
.side{height:100%}
.logo{font-size:20px;font-weight:600;padding:4px 10px 0}
.tag{font-size:12px;color:var(--dim);padding:0 10px 14px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--dim);text-align:left;width:100%}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:rgba(139,92,246,.35);color:#fff}
.nav i{font-style:normal;width:18px;text-align:center}
.grow{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;background:#1d1540;display:grid;place-items:center;font-weight:600}
.me small{color:#4ade80;font-size:12px}
main{display:flex;flex-direction:column;min-width:0;min-height:0;gap:12px}
#scroll{flex:1;overflow-y:auto;min-height:0;padding:4px}
.top{display:flex;gap:14px;flex-wrap:wrap}
.hello{padding:26px;flex:1;min-width:260px;max-width:620px}
.hello h1{font-size:32px;font-weight:600}
.hello h1 b{color:#a78bfa;font-weight:600}
.hello p{color:var(--dim);margin-top:6px}
.snap{padding:22px;min-width:200px}
.snap small{color:var(--dim);display:block;margin-top:4px}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:18px}
.qa button{text-align:left;padding:18px;border-radius:18px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.qa button:hover{border-color:rgba(255,255,255,.35)}
.qa b{font-size:16px}.qa span{font-size:13px;color:var(--dim)}.qa i{font-style:normal;font-size:22px}
.q1{background:rgba(139,92,246,.3)}.q2{background:rgba(217,70,239,.26)}.q3{background:rgba(168,85,247,.3)}.q4{background:rgba(244,114,182,.24)}
#chat{display:flex;flex-direction:column;gap:12px;max-width:820px;margin:0 auto;padding:6px}
.msg{padding:12px 16px;border-radius:16px;white-space:pre-wrap;line-height:1.55;max-width:88%;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:rgba(139,92,246,.4)}
.msg.ai{align-self:flex-start;background:var(--glass);border:1px solid var(--line)}
.msg.err{align-self:flex-start;background:rgba(239,68,68,.18);border:1px solid rgba(239,68,68,.5)}
.msg img{max-width:100%;max-height:360px;border-radius:12px;display:block;margin-top:6px}
pre{position:relative;background:rgba(0,0,0,.4);border-radius:12px;padding:12px;margin:8px 0;overflow-x:auto;white-space:pre;font:13px ui-monospace,Menlo,monospace}
.cp{position:absolute;top:6px;right:6px;font-size:12px;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.14)}
code.in{background:rgba(0,0,0,.35);padding:1px 6px;border-radius:6px;font:13px ui-monospace,monospace}
.prompt{padding:14px 16px;border-radius:26px;border-color:rgba(167,139,250,.5);box-shadow:0 0 40px rgba(139,92,246,.3)}
textarea{width:100%;background:none;border:0;resize:none;outline:0;font-size:16px;max-height:160px;padding:6px 4px}
textarea::placeholder{color:#9b94c4}
.row{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:14px;color:var(--dim)}
.chip:hover{color:#fff}
.chip.on{background:rgba(139,92,246,.45);color:#fff}
select.chip option{color:#000}
#att{display:flex;gap:6px;flex-wrap:wrap}
#att .chip{padding:4px 10px;font-size:13px}
#send{margin-left:auto;width:46px;height:46px;border-radius:50%;background:var(--accent);font-size:20px;color:#fff}
.spaces h2{font-size:15px;font-weight:600;padding:2px 10px 8px}
.mbar{display:none;gap:8px;flex-wrap:wrap}
#sheetBg,#auth{position:fixed;inset:0;background:rgba(15,5,40,.7);display:grid;place-items:center;z-index:10;padding:16px}
.sheet{width:min(560px,100%);max-height:86dvh;overflow:auto;padding:22px;background:rgba(50,22,105,.6)}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet select{width:100%;margin:4px 0 12px;padding:10px 12px}
.sheet label{display:block;font-size:14px;color:var(--dim)}
.sheet input:not([type=range]){width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);margin:4px 0 12px}
.sheet input[type=range]{width:100%;margin:6px 0 14px}
.note{font-size:13px;color:var(--dim);margin:-6px 0 12px}
.item{display:flex;justify-content:space-between;gap:8px;padding:6px 8px 6px 14px;border-radius:12px;background:rgba(255,255,255,.06);margin-bottom:8px;align-items:center}
.open{flex:1;text-align:left;padding:6px 0}
.grid{display:grid;gap:8px}
.grid button{text-align:left;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
@media(max-width:960px){.app{grid-template-columns:1fr}.side,.spaces{display:none}.mbar{display:flex}}
@media(prefers-reduced-motion:no-preference){.dots{animation:p 1s infinite alternate}@keyframes p{to{opacity:.3}}}
body::before{content:"";position:fixed;left:50%;top:18%;width:92vmin;height:92vmin;transform:translateX(-50%);border-radius:50%;border:2px solid rgba(167,139,250,.3);box-shadow:0 0 90px rgba(139,92,246,.35),inset 0 0 120px rgba(139,92,246,.12);pointer-events:none;z-index:-1}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:35vh;background:linear-gradient(transparent,rgba(124,58,237,.28));pointer-events:none;z-index:-1}
.orb{position:fixed;border-radius:50%;filter:blur(70px);z-index:-1;pointer-events:none}
.o1{width:44vmin;height:44vmin;left:-8vmin;top:6vmin;background:#c026d3;opacity:.55}
.o2{width:50vmin;height:50vmin;right:-10vmin;top:30vmin;background:#7c3aed;opacity:.6}
.o3{width:40vmin;height:40vmin;left:30vw;bottom:-14vmin;background:#a855f7;opacity:.5}
.qa button{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 24px rgba(25,5,60,.4)}
#auth{z-index:20;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.authbox{width:min(420px,100%)}
.out{padding:6px 8px;font-size:12px}
@media(prefers-reduced-motion:no-preference){.o1{animation:fl 14s ease-in-out infinite alternate}.o2{animation:fl 18s ease-in-out infinite alternate-reverse}@keyframes fl{to{transform:translate(6vmin,5vmin)}}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div id="auth"><div class="sheet glass authbox">
  <h2>Horizon AI</h2><p class="note">Sign in to continue</p>
  <div class="row" style="margin:0 0 14px"><button class="chip on" id="tIn">Sign in</button><button class="chip" id="tUp">Create account</button></div>
  <label id="lName" class="hidden">Name<input id="a_name" autocomplete="name"></label>
  <label>Email<input id="a_email" type="email" autocomplete="email"></label>
  <label>Password<input id="a_pw" type="password" autocomplete="current-password"></label>
  <label id="lPw2" class="hidden">Confirm password<input id="a_pw2" type="password" autocomplete="new-password"></label>
  <p class="note" id="aerr" style="color:#fca5a5"></p>
  <button class="chip on" id="aGo">Sign in</button>
</div></div>
<div class="app">
  <aside class="side glass">
    <div class="logo">Horizon AI</div><div class="tag">Think. Create. Explore.</div>
    <button class="nav on" data-act="new"><i>+</i>New Chat</button>
    <button class="nav" data-act="search"><i>&#8981;</i>Search</button>
    <button class="nav" data-act="library"><i>&#9636;</i>Library</button>
    <button class="nav" data-act="explore"><i>&#9678;</i>Explore</button>
    <button class="nav" data-act="tools"><i>&#9874;</i>Tools</button>
    <button class="nav" data-act="settings"><i>&#9881;</i>Settings</button>
    <div class="grow"></div>
    <div class="me"><div class="av" id="av"></div><div><div id="who"></div><small>&#9679; Online</small></div><button class="chip out" data-act="out" style="margin-left:auto">Sign out</button></div>
  </aside>

  <main>
    <div class="mbar">
      <button class="chip" data-act="new">New</button><button class="chip" data-act="search">Search</button><button class="chip" data-act="library">Library</button><button class="chip" data-act="explore">Explore</button><button class="chip" data-act="tools">Tools</button><button class="chip" data-act="settings">Settings</button><button class="chip" data-act="out">Sign out</button>
      <select id="spaceSel" class="chip" aria-label="Space"></select>
    </div>
    <div id="scroll">
      <section id="home">
        <div class="top">
          <div class="hello glass"><h1 id="greet"></h1><p>What shall we explore today?</p></div>
          <div class="snap glass"><div id="date"></div><small id="wx"></small></div>
        </div>
        <div class="qa">
          <button class="q1" data-p="Help me create "><i>&#9998;</i><b>Create anything</b><span>Ideas, stories, designs</span></button>
          <button class="q2" data-p="Help me write code for "><i>&lt;/&gt;</i><b>Write code</b><span>Build, debug, improve</span></button>
          <button class="q3" data-p="Help me analyse this data: "><i>&#9641;</i><b>Analyse data</b><span>Get insights, faster</span></button>
          <button class="q4" data-p="Turn this idea into a plan: "><i>&#9733;</i><b>Plan &amp; organise</b><span>Turn ideas into plans</span></button>
        </div>
      </section>
      <section id="chat" class="hidden" aria-live="polite"></section>
    </div>
    <div class="prompt glass">
      <div id="att"></div>
      <textarea id="input" rows="1" placeholder="Ask Horizon AI anything..." aria-label="Message"></textarea>
      <div class="row">
        <button class="chip" id="chipAtt">Attach</button>
        <button class="chip" id="chipWeb">Search Web</button>
        <button class="chip" id="chipVoice">Voice</button>
        <button id="send" aria-label="Send">&#8593;</button>
      </div>
      <input type="file" id="file" multiple accept="image/*,.txt,.md,.csv,.json,.js,.py,.html,.css" class="hidden">
    </div>
  </main>

  <aside class="spaces glass"><h2>Your Spaces</h2><div id="spaceList"></div></aside>
</div>

<div id="sheetBg" class="hidden"><div class="sheet glass"><div class="sh"><h3 id="sheetT"></h3><button class="chip" id="sheetX">Close</button></div><div id="sheetB"></div></div></div>

<script>
const NAME_DEFAULT = "Friend", CITY = { n: "Abuja", lat: 9.06, lon: 7.49 };
const SPACES = {
  "General Chat": "You are a helpful, friendly assistant.",
  "Study Partner": "You are a patient tutor. Explain step by step and check understanding.",
  "Creative Studio": "You are a creative collaborator for writing, design and brainstorming.",
  "Coding Hub": "You are an expert programmer. Give clear, correct code
