<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizon AI</title>
<style>
:root{--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--text:#f1eeff;--dim:#b9b2e0;--accent:#8b5cf6}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(55% 45% at 50% 40%,#4a2a9a 0%,transparent 70%),radial-gradient(40% 40% at 90% 95%,#2b1c70 0%,transparent 70%),linear-gradient(#0b0722,#140b3a 60%,#1b1050) fixed}
button,textarea,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid #c4b5fd;outline-offset:2px}
.hidden{display:none!important}
.app{display:grid;grid-template-columns:230px 1fr 250px;gap:16px;height:100dvh;padding:16px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:0 8px 32px rgba(0,0,0,.35)}
.side,.spaces{padding:18px 14px;display:flex;flex-direction:column;gap:6px;align-self:start;max-height:100%}
.side{height:100%}
.logo{font-size:20px;font-weight:600;padding:4px 10px 0}
.tag{font-size:12px;color:var(--dim);padding:0 10px 14px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--dim);text-align:left;width:100%}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:rgba(139,92,246,.35);color:#fff}
.nav i{font-style:normal;width:18px;text-align:center}
.grow{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;background:#1d1540;display:grid;place-items:center;font-weight:600}
.me small{color:#4ade80;font-size:12px}
main{display:flex;flex-direction:column;min-width:0;min-height:0;gap:12px}
#scroll{flex:1;overflow-y:auto;min-height:0;padding:4px}
.top{display:flex;gap:14px;flex-wrap:wrap}
.hello{padding:26px;flex:1;min-width:260px;max-width:620px}
.hello h1{font-size:32px;font-weight:600}
.hello h1 b{color:#a78bfa;font-weight:600}
.hello p{color:var(--dim);margin-top:6px}
.snap{padding:22px;min-width:200px}
.snap small{color:var(--dim);display:block;margin-top:4px}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:18px}
.qa button{text-align:left;padding:18px;border-radius:18px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.qa button:hover{border-color:rgba(255,255,255,.35)}
.qa b{font-size:16px}.qa span{font-size:13px;color:var(--dim)}.qa i{font-style:normal;font-size:22px}
.q1{background:rgba(139,92,246,.22)}.q2{background:rgba(59,130,246,.2)}.q3{background:rgba(16,185,129,.18)}.q4{background:rgba(245,158,11,.18)}
#chat{display:flex;flex-direction:column;gap:12px;max-width:820px;margin:0 auto;padding:6px}
.msg{padding:12px 16px;border-radius:16px;white-space:pre-wrap;line-height:1.55;max-width:88%;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:rgba(139,92,246,.4)}
.msg.ai{align-self:flex-start;background:var(--glass);border:1px solid var(--line)}
.msg.err{align-self:flex-start;background:rgba(239,68,68,.18);border:1px solid rgba(239,68,68,.5)}
.msg img{max-width:100%;max-height:360px;border-radius:12px;display:block;margin-top:6px}
pre{position:relative;background:rgba(0,0,0,.4);border-radius:12px;padding:12px;margin:8px 0;overflow-x:auto;white-space:pre;font:13px ui-monospace,Menlo,monospace}
.cp{position:absolute;top:6px;right:6px;font-size:12px;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.14)}
code.in{background:rgba(0,0,0,.35);padding:1px 6px;border-radius:6px;font:13px ui-monospace,monospace}
.prompt{padding:14px 16px;border-radius:26px;border-color:rgba(167,139,250,.5);box-shadow:0 0 40px rgba(139,92,246,.3)}
textarea{width:100%;background:none;border:0;resize:none;outline:0;font-size:16px;max-height:160px;padding:6px 4px}
textarea::placeholder{color:#9b94c4}
.row{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:14px;color:var(--dim)}
.chip:hover{color:#fff}
.chip.on{background:rgba(139,92,246,.45);color:#fff}
select.chip option{color:#000}
#att{display:flex;gap:6px;flex-wrap:wrap}
#att .chip{padding:4px 10px;font-size:13px}
#send{margin-left:auto;width:46px;height:46px;border-radius:50%;background:var(--accent);font-size:20px;color:#fff}
.spaces h2{font-size:15px;font-weight:600;padding:2px 10px 8px}
.mbar{display:none;gap:8px;flex-wrap:wrap}
#sheetBg{position:fixed;inset:0;background:rgba(5,3,20,.65);display:grid;place-items:center;z-index:10;padding:16px}
.sheet{width:min(560px,100%);max-height:86dvh;overflow:auto;padding:22px;background:rgba(32,20,74,.9)}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet select{width:100%;margin:4px 0 12px;padding:10px 12px}
.sheet label{display:block;font-size:14px;color:var(--dim)}
.sheet input:not([type=range]){width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);margin:4px 0 12px}
.sheet input[type=range]{width:100%;margin:6px 0 14px}
.note{font-size:13px;color:var(--dim);margin:-6px 0 12px}
.item{display:flex;justify-content:space-between;gap:8px;padding:6px 8px 6px 14px;border-radius:12px;background:rgba(255,255,255,.06);margin-bottom:8px;align-items:center}
.open{flex:1;text-align:left;padding:6px 0}
.grid{display:grid;gap:8px}
.grid button{text-align:left;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
@media(max-width:960px){.app{grid-template-columns:1fr}.side,.spaces{display:none}.mbar{display:flex}}
@media(prefers-reduced-motion:no-preference){.dots{animation:p 1s infinite alternate}@keyframes p{to{opacity:.3}}}
</style>
</head>
<body>
<div class="app">
  <aside class="side glass">
    <div class="logo">Horizon AI</div><div class="tag">Think. Create. Explore.</div>
    <button class="nav on" data-act="new"><i>+</i>New Chat</button>
    <button class="nav" data-act="search"><i>&#8981;</i>Search</button>
    <button class="nav" data-act="library"><i>&#9636;</i>Library</button>
    <button class="nav" data-act="explore"><i>&#9678;</i>Explore</button>
    <button class="nav" data-act="tools"><i>&#9874;</i>Tools</button>
    <button class="nav" data-act="settings"><i>&#9881;</i>Settings</button>
    <div class="grow"></div>
    <div class="me"><div class="av" id="av"></div><div><div id="who"></div><small>&#9679; Online</small></div></div>
  </aside>

  <main>
    <div class="mbar">
      <button class="chip" data-act="new">New</button><button class="chip" data-act="search">Search</button><button class="chip" data-act="library">Library</button><button class="chip" data-act="explore">Explore</button><button class="chip" data-act="tools">Tools</button><button class="chip" data-act="settings">Settings</button>
      <select id="spaceSel" class="chip" aria-label="Space"></select>
    </div>
    <div id="scroll">
      <section id="home">
        <div class="top">
          <div class="hello glass"><h1 id="greet"></h1><p>What shall we explore today?</p></div>
          <div class="snap glass"><div id="date"></div><small id="wx"></small></div>
        </div>
        <div class="qa">
          <button class="q1" data-p="Help me create "><i>&#9998;</i><b>Create anything</b><span>Ideas, stories, designs</span></button>
          <button class="q2" data-p="Help me write code for "><i>&lt;/&gt;</i><b>Write code</b><span>Build, debug, improve</span></button>
          <button class="q3" data-p="Help me analyse this data: "><i>&#9641;</i><b>Analyse data</b><span>Get insights, faster</span></button>
          <button class="q4" data-p="Turn this idea into a plan: "><i>&#9733;</i><b>Plan &amp; organise</b><span>Turn ideas into plans</span></button>
        </div>
      </section>
      <section id="chat" class="hidden" aria-live="polite"></section>
    </div>
    <div class="prompt glass">
      <div id="att"></div>
      <textarea id="input" rows="1" placeholder="Ask Horizon AI anything..." aria-label="Message"></textarea>
      <div class="row">
        <button class="chip" id="chipAtt">Attach</button>
        <button class="chip" id="chipImg">Generate Image</button>
        <button class="chip" id="chipWeb">Search Web</button>
        <button class="chip" id="chipVoice">Voice</button>
        <button id="send" aria-label="Send">&#8593;</button>
      </div>
      <input type="file" id="file" multiple accept="image/*,.txt,.md,.csv,.json,.js,.py,.html,.css" class="hidden">
    </div>
  </main>

  <aside class="spaces glass"><h2>Your Spaces</h2><div id="spaceList"></div></aside>
</div>

<div id="sheetBg" class="hidden"><div class="sheet glass"><div class="sh"><h3 id="sheetT"></h3><button class="chip" id="sheetX">Close</button></div><div id="sheetB"></div></div></div>

<script>
const NAME_DEFAULT = "Enesi", CITY = { n: "Abuja", lat: 9.06, lon: 7.49 };
const SPACES = {
  "General Chat": "You are a helpful, friendly assistant.",
  "Study Partner": "You are a patient tutor. Explain step by step and check understanding.",
  "Creative Studio": "You are a creative collaborator for writing, design and brainstorming.",
  "Coding Hub": "You are an expert programmer. Give clear, correct code with short explanations.",
  "Research": "You are a careful research assistant. Be accurate and say when you are unsure."
};
const EXPLORE = ["Explain quantum computing like I am 12","Write a cover letter for a junior developer role","Give me a 4-week study plan to learn Python","Debug this code and explain the fix: ","Brainstorm 10 names for a coffee shop","Summarise the key ideas of stoicism","Plan a 3-day budget trip to Lagos","Write a short story about a robot learning to paint"];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { alert("Browser storage is full. Delete some chats in Library."); } };
const GEM = "https://generativelanguage.googleapis.com/v1beta/openai", OAI = "https://api.openai.com/v1";
let S = { name: NAME_DEFAULT, key: "", base: GEM, model: "gemini-flash-latest", imageModel: "gpt-image-1", temp: 0.7, ...load("hz_s", {}) };
const isOAI = () => /api\.openai\.com/.test(S.base);
const api = (p) => S.base.replace(/\/+$/, "") + p;
const errMsg = (j, d) => (Array.isArray(j) ? j[0] : j)?.error?.message || d;
let chats = load("hz_c", []), cur, space = "General Chat", att = [], imgMode = false, webMode = false, ctrl = null, busy = false;

const textOf = (c) => typeof c === "string" ? c : c.filter((p) => p.type === "text").map((p) => p.text).join("\n");
const imgsOf = (c) => Array.isArray(c) ? c.filter((p) => p.type === "image_url").map((p) => p.image_url.url) : [];
const strip = (m) => ({ role: m.role, content: m.img ? "[generated image]" : Array.isArray(m.content) ? textOf(m.content) : m.content,
  show: (m.show ?? (m.img ? "" : textOf(m.content))) + (imgsOf(m.content).length ? "\n[image attached]" : "") });
const hdr = () => ({ "Content-Type": "application/json", Authorization: "Bearer " + S.key });
const scrollEnd = () => { $("#scroll").scrollTop = $("#scroll").scrollHeight; };

function md(t) {
  return t.split("```").map((p, i) => i % 2
    ? `<pre><button class="cp">Copy</button><code>${esc(p.replace(/^[\w+#-]*\n/, ""))}</code></pre>`
    : esc(p).replace(/`([^`\n]+)`/g, '<code class="in">$1</code>').replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")).join("");
}
function fill(d, m) {
  if (m.img) { d.innerHTML = `<img src="${m.img}" alt="Generated image">`; return; }
  if (m.role === "user") { d.textContent = m.show ?? textOf(m.content); imgsOf(m.content).forEach((u) => { const i = new Image(); i.src = u; d.appendChild(i); }); }
  else d.innerHTML = md(textOf(m.content));
}
function draw(m) {
  const d = document.createElement("div");
  d.className = "msg " + (m.role === "user" ? "user" : "ai");
  fill(d, m); $("#chat").appendChild(d); scrollEnd(); return d;
}
function persist() {
  if (!cur.msgs.length) return;
  const c = { ...cur, msgs: cur.msgs.map(strip) };
  chats = [c, ...chats.filter((x) => x.id !== cur.id)].slice(0, 50);
  store("hz_c", chats);
}
function newChat() {
  if (ctrl) ctrl.abort();
  cur = { id: Date.now(), title: "New chat", msgs: [] }; att = []; showAtt();
  $("#chat").innerHTML = ""; $("#chat").classList.add("hidden"); $("#home").classList.remove("hidden"); $("#input").focus();
}
function openChat(c) {
  if (!c) return;
  cur = JSON.parse(JSON.stringify(c));
  $("#home").classList.add("hidden"); $("#chat").classList.remove("hidden"); $("#chat").innerHTML = "";
  cur.msgs.forEach(draw); closeSheet();
}

async function genImage(prompt) {
  const body = { model: S.imageModel, prompt, size: "1024x1024", n: 1 };
  if (/^dall-e/.test(S.imageModel)) body.response_format = "b64_json";
  const r = await fetch(api("/images/generations"), { method: "POST", headers: hdr(), body: JSON.stringify(body), signal: ctrl.signal });
  const j = await r.json();
  if (!r.ok) throw new Error(errMsg(j, "Image request failed."));
  const d = j.data[0];
  return d.b64_json ? "data:image/png;base64," + d.b64_json : d.url;
}

async function send() {
  if (busy) { ctrl.abort(); return; }
  const text = $("#input").value.trim();
  if (!text && !att.length) return;
  if (!S.key) { act("settings"); return; }
  let api = text, show = text;
  att.filter((a) => a.type === "txt").forEach((a) => { api += `\n\n[File: ${a.name}]\n${a.data}`; show += `\n[file: ${a.name}]`; });
  const ims = att.filter((a) => a.type === "img");
  const content = ims.length ? [{ type: "text", text: api || "Describe this image." }, ...ims.map((a) => ({ type: "image_url", image_url: { url: a.data } }))] : api;
  const um = { role: "user", content, show };
  $("#input").value = ""; $("#input").style.height = "auto"; att = []; showAtt();
  $("#home").classList.add("hidden"); $("#chat").classList.remove("hidden");
  cur.msgs.push(um); draw(um);
  if (cur.title === "New chat") cur.title = (text || "Attachment").slice(0, 40);
  const el = draw({ role: "assistant", content: "Thinking..." }); el.classList.add("dots");
  busy = true; ctrl = new AbortController(); $("#send").innerHTML = "&#9632;";
  let acc = "";
  try {
    if (imgMode) {
      const m = { role: "assistant", content: "", img: await genImage(text) };
      cur.msgs.push(m); fill(el, m); el.classList.remove("dots"); setImg(false);
    } else {
      const body = { model: webMode ? "gpt-4o-search-preview" : S.model, stream: true,
        messages: [{ role: "system", content: SPACES[space] }, ...cur.msgs.filter((m) => !m.img).map((m) => ({ role: m.role, content: m.content }))] };
      if (webMode) body.web_search_options = {}; else if (!/^(o\d|gpt-5)/.test(S.model)) body.temperature = +S.temp;
      const r = await fetch(api("/chat/completions"), { method: "POST", headers: hdr(), body: JSON.stringify(body), signal: ctrl.signal });
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(errMsg(j, "Request failed (" + r.status + ").")); }
      const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
      el.classList.remove("dots");
      for (;;) {
        const { done, value } = await rd.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split("\n"); buf = lines.pop();
        for (const l of lines) {
          if (!l.startsWith("data: ")) continue;
          const p = l.slice(6).trim(); if (p === "[DONE]") continue;
          try { acc += JSON.parse(p).choices?.[0]?.delta?.content || ""; } catch {}
        }
        el.innerHTML = md(acc); scrollEnd();
      }
      cur.msgs.push({ role: "assistant", content: acc });
    }
  } catch (e) {
    if (e.name === "AbortError") { if (acc) cur.msgs.push({ role: "assistant", content: acc }); else { el.remove(); cur.msgs.pop(); } }
    else { el.className = "msg err"; el.textContent = e.message; cur.msgs.pop(); $("#input").value = text; }
  }
  busy = false; ctrl = null; $("#send").innerHTML = "&#8593;"; persist();
}

function showAtt() {
  $("#att").innerHTML = att.map((a, i) => `<button class="chip" data-rm="${i}">${esc(a.name)} &#10005;</button>`).join("");
}
function setImg(v) { if (v && !isOAI()) { alert("Image generation only works with an OpenAI key."); return; } imgMode = v; $("#chipImg").classList.toggle("on", v); $("#input").placeholder = v ? "Describe the image to generate..." : "Ask Horizon AI anything..."; }
const SR = window.SpeechRecognition || window.webkitSpeechRecognition; let rec = null;
function voice() {
  if (!SR) { alert("Voice input is not supported in this browser."); return; }
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.interimResults = false;
  rec.onresult = (e) => { $("#input").value += (e.results[0][0].transcript + " "); };
  rec.onend = () => { rec = null; $("#chipVoice").classList.remove("on"); };
  rec.start(); $("#chipVoice").classList.add("on");
}
function exportChat() {
  const t = cur.msgs.map((m) => `**${m.role === "user" ? "You" : "AI"}:** ${m.show ?? (m.img ? "[image]" : textOf(m.content))}`).join("\n\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([t], { type: "text/markdown" })); a.download = "horizon-chat.md"; a.click();
}

function sheet(title, html) { $("#sheetT").textContent = title; $("#sheetB").innerHTML = html; $("#sheetBg").classList.remove("hidden"); }
function closeSheet() { $("#sheetBg").classList.add("hidden"); }
function list(f) {
  const q = (f || "").toLowerCase();
  const hits = chats.filter((c) => !q || c.title.toLowerCase().includes(q) || c.msgs.some((m) => textOf(m.content).toLowerCase().includes(q)));
  return hits.length ? hits.map((c) => `<div class="item"><button class="open" data-id="${c.id}">${esc(c.title)}</button><button class="del" data-id="${c.id}" aria-label="Delete chat">&#10005;</button></div>`).join("") : '<p class="note">No chats found.</p>';
}
function act(a) {
  if (a === "new") return newChat();
  if (a === "library") return sheet("Library", list());
  if (a === "search") { sheet("Search chats", '<input id="q" placeholder="Search your chats..." autocomplete="off"><div id="res">' + list() + "</div>"); $("#q").oninput = (e) => { $("#res").innerHTML = list(e.target.value); }; return $("#q").focus(); }
  if (a === "explore") return sheet("Explore", '<div class="grid">' + EXPLORE.map((p) => `<button data-p="${esc(p)}">${esc(p)}</button>`).join("") + "</div>");
  if (a === "tools") return sheet("Tools", '<div class="grid"><button data-t="img">Generate an image</button><button data-t="attach">Attach an image or file</button><button data-t="voice">Dictate with your voice</button><button data-t="export">Export this chat (.md)</button><button data-t="clear">Delete all saved chats</button></div>');
  if (a === "settings") {
    sheet("Settings", `<label>Your name<input id="f_name" value="${esc(S.name)}"></label>
<label>Provider<select id="f_prov" class="chip"><option value="g"${S.base === GEM ? " selected" : ""}>Google Gemini</option><option value="o"${isOAI() ? " selected" : ""}>OpenAI</option><option value="c"${S.base !== GEM && !isOAI() ? " selected" : ""}>Custom</option></select></label>
<label>API key<input id="f_key" type="password" value="${esc(S.key)}" placeholder="Paste your key" autocomplete="off"></label>
<p class="note">Saved only in this browser. It is never put in the code and only goes to the provider you pick.</p>
<label>Base URL<input id="f_base" value="${esc(S.base)}"></label>
<label>Chat model<input id="f_model" list="ml" value="${esc(S.model)}"></label>
<datalist id="ml"><option>gemini-flash-latest<option>gemini-2.5-flash<option>gemini-2.5-flash-lite<option>gpt-4o-mini<option>gpt-4o<option>gpt-4.1-mini</datalist>
<label>Image model (OpenAI only)<input id="f_img" value="${esc(S.imageModel)}"></label>
<label>Creativity: <span id="tv">${S.temp}</span><input id="f_temp" type="range" min="0" max="1.5" step="0.1" value="${S.temp}"></label>
<button class="chip on" id="saveS">Save settings</button>`);
    $("#f_prov").onchange = (e) => { const v = e.target.value; if (v === "g") { $("#f_base").value = GEM; $("#f_model").value = "gemini-flash-latest"; } if (v === "o") { $("#f_base").value = OAI; $("#f_model").value = "gpt-4o-mini"; } };
    $("#f_temp").oninput = (e) => { $("#tv").textContent = e.target.value; };
    $("#saveS").onclick = () => {
      S = { ...S, name: $("#f_name").value.trim() || NAME_DEFAULT, key: $("#f_key").value.trim(), base: $("#f_base").value.trim() || GEM, model: $("#f_model").value.trim() || "gemini-flash-latest", imageModel: $("#f_img").value.trim() || "gpt-image-1", temp: +$("#f_temp").value };
      store("hz_s", S); head(); closeSheet();
    };
  }
}
function head() {
  const h = new Date().getHours();
  $("#greet").innerHTML = `Good ${h < 12 ? "morning" : h < 18 ? "afternoon" : "evening"}, <b>${esc(S.name)}</b>.`;
  $("#who").textContent = S.name; $("#av").textContent = S.name[0] || "?";
}
function renderSpaces() {
  $("#spaceList").innerHTML = Object.keys(SPACES).map((n) => `<button class="nav${n === space ? " on" : ""}" data-space="${esc(n)}">${esc(n)}</button>`).join("");
  $("#spaceSel").innerHTML = Object.keys(SPACES).map((n) => `<option${n === space ? " selected" : ""}>${esc(n)}</option>`).join("");
}

document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-act]"); if (a) act(a.dataset.act);
  const s = e.target.closest("[data-space]"); if (s) { space = s.dataset.space; renderSpaces(); newChat(); }
  const q = e.target.closest(".qa button"); if (q) { $("#input").value = q.dataset.p; $("#input").focus(); }
  const rm = e.target.closest("[data-rm]"); if (rm) { att.splice(+rm.dataset.rm, 1); showAtt(); }
  if (e.target.classList.contains("cp")) { navigator.clipboard.writeText(e.target.nextElementSibling.textContent); e.target.textContent = "Copied"; }
});
$("#sheetB").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.classList.contains("open")) openChat(chats.find((c) => c.id == b.dataset.id));
  else if (b.classList.contains("del")) { chats = chats.filter((c) => c.id != b.dataset.id); store("hz_c", chats); b.parentElement.remove(); }
  else if (b.dataset.p) { $("#input").value = b.dataset.p; closeSheet(); $("#input").focus(); }
  else if (b.dataset.t) {
    const t = b.dataset.t;
    if (t === "clear") { if (confirm("Delete all saved chats?")) { chats = []; store("hz_c", chats); } closeSheet(); return; }
    closeSheet();
    if (t === "img") setImg(true); else if (t === "attach") $("#file").click(); else if (t === "voice") voice(); else if (t === "export") exportChat();
  }
};
$("#spaceSel").onchange = (e) => { space = e.target.value; renderSpaces(); newChat(); };
$("#sheetX").onclick = closeSheet;
$("#sheetBg").onclick = (e) => { if (e.target.id === "sheetBg") closeSheet(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
$("#chipAtt").onclick = () => $("#file").click();
$("#chipImg").onclick = () => setImg(!imgMode);
$("#chipWeb").onclick = () => { if (!webMode && !isOAI()) { alert("Web search only works with an OpenAI key."); return; } webMode = !webMode; $("#chipWeb").classList.toggle("on", webMode); };
$("#chipVoice").onclick = voice;
$("#file").onchange = async (e) => {
  for (const f of e.target.files) {
    if (f.type.startsWith("image/")) {
      if (f.size > 4e6) { alert(f.name + " is over 4 MB."); continue; }
      const data = await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
      att.push({ name: f.name, type: "img", data });
    } else att.push({ name: f.name, type: "txt", data: (await f.text()).slice(0, 100000) });
  }
  e.target.value = ""; showAtt();
};
$("#send").onclick = send;
$("#input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("#input").addEventListener("input", (e) => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 160) + "px"; });

head(); renderSpaces(); newChat();
if (!S.key) act("settings");
(async () => {
  $("#date").textContent = new Date().toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
  try {
    const j = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${CITY.lat}&longitude=${CITY.lon}&current_weather=true`)).json();
    const w = j.current_weather, c = w.weathercode;
    $("#wx").textContent = `${Math.round(w.temperature)}\u00B0C, ${c === 0 ? "Clear" : c < 4 ? "Partly cloudy" : c < 50 ? "Fog" : c < 70 ? "Rain" : c < 80 ? "Snow" : c < 90 ? "Showers" : "Thunderstorm"} in ${CITY.n}`;
  } catch { $("#wx").textContent = CITY.n; }
})();
</script>
</body>
